name: vigil

# The three long-running services restart; `migrate` deliberately does
# not, because it is a one-shot job and `on-failure` would loop it
# against a database it cannot migrate. A monitoring tool that stays down
# after a crash or a host reboot is worse than no monitoring at all: it
# is a green dashboard nobody is updating, and the silence reads as
# health. The probe agents have carried this since 1.14.0; the services
# they report to had not.
x-service-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    # Postgres 18+ required: the schema uses the native uuidv7() function.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigil}
      POSTGRES_DB: vigil
    volumes:
      # postgres:18 stores data under /var/lib/postgresql (PGDATA is
      # /var/lib/postgresql/18/docker) — mount the parent, not /data, or
      # the data lands in an anonymous volume and is lost on `down`.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: worker
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgresql://vigil:${POSTGRES_PASSWORD:-vigil}@postgres:5432/vigil
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *restart
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://vigil:${POSTGRES_PASSWORD:-vigil}@postgres:5432/vigil
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Vigil <onboarding@resend.dev>}
      # Enumerated here or it never reaches the container: an operator
      # following docs/DEMO.md sets it in .env, gets `false`, and stands
      # up a public host with sign-up enabled and assertNotDemo() inert
      # — while the demo owner password sits on our own sales pages.
      DEMO_MODE: ${DEMO_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_PRIVATE_MONITOR_TARGETS: ${ALLOW_PRIVATE_MONITOR_TARGETS:-false}
      # Whether Settings > Workers shows hostnames, process ids, build
      # versions and installation-wide queue depths. Read by the app, so
      # it has to be here and not only on the worker: without it the
      # switch could be set in .env and the page would go on showing
      # every member the same three numbers, with no way to turn the
      # detail on in the deployment we actually ship. Same failure as
      # DEMO_MODE above, and the comment there is the one that should
      # have caught it.
      VIGIL_FLEET_DETAIL: ${VIGIL_FLEET_DETAIL:-false}
      RDAP_BASE_URL: ${RDAP_BASE_URL:-https://rdap.org}
    # Readiness, not liveness. What compose does with a healthcheck is
    # answer `depends_on: service_healthy` and colour `docker ps`, and
    # both of those questions mean "may this be used", so the probe has
    # to be the one that refuses an empty or half-migrated database.
    # `/api/live` would answer yes to a process whose schema does not
    # exist. Nothing here restarts on the healthcheck — `restart:
    # unless-stopped` covers a process that dies, which is the only thing
    # liveness is for.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/api/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *restart
    build:
      context: .
      target: worker
      args:
        # Stamped into the image, so a replica reports its build however
        # it was started. The runtime variable below still wins when an
        # operator sets one, but it is no longer the only source.
        VIGIL_WORKER_VERSION: ${VIGIL_WORKER_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql://vigil:${POSTGRES_PASSWORD:-vigil}@postgres:5432/vigil
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Vigil <onboarding@resend.dev>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_PRIVATE_MONITOR_TARGETS: ${ALLOW_PRIVATE_MONITOR_TARGETS:-false}
      # How many due monitors one scheduler tick enqueues. Enumerated
      # here or it does not reach the container: compose passes only what
      # this list names, so a large installation that sets it in .env and
      # does not see it here would raise the setting `docs/SCALING.md`
      # tells it to raise and observe nothing change.
      MONITOR_SCHEDULER_BATCH: ${MONITOR_SCHEDULER_BATCH:-5000}
      # What the fleet view reports as this replica's build. `npx` does
      # not set `npm_package_version` - only `npm run` does - and the
      # worker image starts with npx, so without this every replica
      # reported "unknown" and the version column and the rolling-deploy
      # banner were dead in the one deployment we ship.
      #
      # No default on purpose. `${VIGIL_WORKER_VERSION:-}` would pass an
      # empty string when the operator has not set one, and an empty
      # string overrides the value the image was built with - so the
      # build arg above would be erased by the line meant to complement
      # it. A bare key passes the variable through only when it is set.
      VIGIL_WORKER_VERSION:
      # Domain-expiry monitors resolve through this. An air-gapped
      # install that sets it in .env and does not see it here reaches
      # for rdap.org, fails to route, and every domain monitor reports a
      # false DOWN — a transport error is judged `down`, not `unknown`.
      RDAP_BASE_URL: ${RDAP_BASE_URL:-https://rdap.org}
    # Lets the worker, which runs as a non-root user, open an
    # unprivileged ICMP datagram socket. Without it every `ping` monitor
    # reports `indeterminate` forever — correctly, since the probe truly
    # cannot run, but the feature is then dead in the box we ship.
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
